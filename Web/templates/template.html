<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
    <meta name="baidu-site-verification" content="codeva-D86XF7EVRs" />
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>{% block title %}免费音乐在线试听 - 在线听歌不用下载 - 爱听音乐网|杯子音乐网{% endblock %}</title>
    <meta name="keywords" content="{% block keywords %}杯子音乐网,爱听音乐网,免费音乐,免费音乐网,在线听音乐,免费听歌,在线听歌,音乐在线播放,在线听歌网站,免登录听歌,无需注册听歌,不用下载的音乐网站,免费音乐在线听,免费音乐下载,MP3免费下载,Mp3歌曲免费下载,DJ舞曲,歌词下载,mp3下载,经典老歌{% endblock %}" />
    <meta name="description" content="{% block description %}爱听音乐网（杯子音乐网）免费音乐在线试听网站,无需下载音乐软件、无需注册登录、无需付费,打开网页即可在线听完整歌曲。提供Mp3歌曲免费下载、DJ舞曲、歌词同步、MV视频在线观看,收录流行音乐、经典老歌、英文歌曲等海量免费音乐。{% endblock %}" />
    <!-- 搜索引擎爬虫：允许收录与跟随链接 -->
    <meta name="robots" content="index, follow" />
    <!-- 规范链接：声明当前页面唯一权威地址，避免重复内容（分页/参数等）被拆分收录 -->
    <link rel="canonical" href="{% block canonical %}{{ request.build_absolute_uri }}{% endblock %}" />
    <!-- 移动端浏览器主题色 -->
    <meta name="theme-color" content="#1677ff" />
    <link rel="shortcut icon" href="/media/favicon.ico">
    <link rel="bookmark" href="/media/favicon.ico">
    <!-- Open Graph 协议：社交平台（微信/QQ/微博等）分享时生成卡片，各页面可覆盖 block 定制 -->
    <meta property="og:site_name" content="杯子音乐网" />
    <meta property="og:type" content="{% block og_type %}website{% endblock %}" />
    <meta property="og:title" content="{% block og_title %}免费音乐在线试听 - 在线听歌不用下载 - 爱听音乐网|杯子音乐网{% endblock %}" />
    <meta property="og:description" content="{% block og_description %}爱听音乐网（杯子音乐网）免费音乐在线试听网站,无需下载音乐软件、无需注册登录、无需付费,打开网页即可在线听完整歌曲。{% endblock %}" />
    <meta property="og:url" content="{% block og_url %}{{ request.build_absolute_uri }}{% endblock %}" />
    <meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}/static/images/logo.png{% endblock %}" />
    <meta property="og:locale" content="zh_CN" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{% block twitter_title %}免费音乐在线试听 - 在线听歌不用下载 - 爱听音乐网|杯子音乐网{% endblock %}" />
    <meta name="twitter:description" content="{% block twitter_description %}爱听音乐网（杯子音乐网）免费音乐在线试听网站,无需下载音乐软件、无需注册登录、无需付费,打开网页即可在线听完整歌曲。{% endblock %}" />
    <meta name="twitter:image" content="{% block twitter_image %}{{ request.scheme }}://{{ request.get_host }}/static/images/logo.png{% endblock %}" />
    <!-- 结构化数据（schema.org）：声明站点信息与站内搜索，助力搜索引擎理解网站 -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "杯子音乐网",
        "url": "{{ request.scheme }}://{{ request.get_host }}/",
        "description": "免费音乐下载网站，提供Mp3歌曲免费下载、DJ舞曲下载、歌词下载、MV视频在线观看。",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "{{ request.scheme }}://{{ request.get_host }}/so/{search_term_string}.html",
            "query-input": "required name=search_term_string"
        }
    }
    </script>
    <link rel="stylesheet" href="/static/css/base.css?v=v2.12" />
    <link rel="stylesheet" href="/static/layui/css/layui.min.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="/static/layui/js/layui.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="/static/js/common.js?v=v2.2"></script>
    {% block head %}{% endblock %}

</head>

<body>
    {% include 'common_html/headers.html' %}
    {% block content %}{% endblock %}

    <!-- 全局底部悬浮播放条（网易云 m-playbar 风格，全站固定；控制逻辑见 /static/js/player.js） -->
    <div class="m-playbar m-playbar-unlock" id="m-playbar">
        <a href="javascript:;" class="m-playbar-unlock-btn" id="m-btn-unlock" title="收起"><i class="fa fa-angle-down"></i></a>
        <div class="m-playbar-wrap">
            <!-- 左侧：封面 + 歌名/歌手 + 喜欢 -->
            <div class="m-playbar-left">
                <div class="m-playbar-cover"><img id="m-cover" src="" alt="封面" style="display:none;"></div>
                <div class="m-playbar-info">
                    <a class="m-playbar-name" id="m-song-name" href="javascript:;">暂无播放任务</a>
                    <span class="m-playbar-artist" id="m-song-artist"></span>
                </div>
                <a href="javascript:;" class="m-playbar-like" id="m-btn-like" title="喜欢"><i class="fa fa-heart-o"></i></a>
            </div>
            <!-- 中部：播放控制 + 进度条 -->
            <div class="m-playbar-center">
                <div class="m-playbar-btns">
                    <a href="javascript:;" class="m-btn-mode" id="m-btn-mode" title="列表循环"><i class="fa fa-repeat"></i><em class="m-mode-1">1</em></a>
                    <a href="javascript:;" class="m-btn-prev" id="m-btn-prev" title="上一首"><i class="fa fa-step-backward"></i></a>
                    <a href="javascript:;" class="m-btn-play jp-play" id="m-btn-play" title="播放"><i class="fa fa-play"></i></a>
                    <a href="javascript:;" class="m-btn-pause jp-pause" id="m-btn-pause" title="暂停" style="display:none;"><i class="fa fa-pause"></i></a>
                    <a href="javascript:;" class="m-btn-next" id="m-btn-next" title="下一首"><i class="fa fa-step-forward"></i></a>
                    <a href="javascript:;" class="m-btn-list" id="m-btn-list" title="待播放列表"><i class="fa fa-list-ul"></i></a>
                </div>
                <div class="m-playbar-prog">
                    <span class="m-time jp-current-time">00:00</span>
                    <div class="jp-progress"><div class="jp-seek-bar"><div class="jp-play-bar"></div></div></div>
                    <span class="m-time jp-duration">00:00</span>
                </div>
            </div>
            <!-- 右侧：音量 -->
            <div class="m-playbar-right">
                <div class="m-playbar-vol">
                    <a href="javascript:;" class="m-btn-rate" id="m-btn-rate" title="倍速播放">1x</a>
                    <a href="javascript:;" class="jp-mute" title="静音"><i class="fa fa-volume-up"></i></a>
                    <a href="javascript:;" class="jp-unmute" title="取消静音" style="display:none;"><i class="fa fa-volume-off"></i></a>
                    <div class="jp-volume-bar"><div class="jp-volume-bar-value"></div></div>
                </div>
            </div>
        </div>
        <!-- 待播放列表 / 我的喜欢 面板 -->
        <div class="m-playlist" id="m-playlist" style="display:none;">
            <div class="m-playlist-head">
                <a href="javascript:;" class="m-tab active" data-tab="queue">待播放列表</a>
                <a href="javascript:;" class="m-tab" data-tab="likes">我的喜欢</a>
                <a href="javascript:;" class="m-playlist-clear" id="m-btn-clear">清空</a>
            </div>
            <ul class="m-playlist-body" id="m-playlist-body"></ul>
        </div>
        <div id="m-playbar-player" style="width:0;height:0;position:absolute;overflow:hidden;opacity:0;"></div>
    </div>
    <script src="/static/js/jplayer.min.js"></script>
    <script src="/static/js/player.js?v=v9"></script>

    {% block js %}{% endblock %}
    
</body>

</html>
